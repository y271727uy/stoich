[package]
name = "stoich-worker"
version = "0.1.0"
edition = "2021"
description = "In-process recipe solver. Java calls one JNI method with a protobuf request and gets a protobuf response."
license = "MIT"

[lib]
name = "stoich"
path = "../../lib/stoich.rs"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
prost = "0.13"
stoich-kernel = { path = "../kernel" }

[build-dependencies]
prost-build = "0.13"
