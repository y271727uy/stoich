plugins {
    id 'java-library'
}

group = 'dev.stoich'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test') {
    useJUnitPlatform()
}

def workerVersion = version
def nativeRoot = layout.buildDirectory.dir('native')
def nativeLibrary = file('rust/target/release/stoich.dll')
// CI builds each platform itself and passes the collected libraries here. Absent on a local build.
def prebuiltRoot = findProperty('stoichPrebuilt')
def skipNative = findProperty('stoichSkipNative') != null || prebuiltRoot != null
def libraryOverride = findProperty('stoichLibrary')

// This machine has no MSVC linker. The GNU toolchain supplies the link, WinLibs supplies dlltool,
// and protoc compiles the frame schema. Both tool paths can be overridden from the environment.
def mingwBin = System.getenv('MINGW_BIN') ?: 'D:/document/dev/tools/mingw-bin'
def protoc = System.getenv('PROTOC') ?: 'D:/document/dev/tools/protoc/bin/protoc.exe'

tasks.register('cargoBuild', Exec) {
    group = 'stoich'
    description = 'Compile the Rust solver into stoich.dll.'
    workingDir = file('rust')
    environment 'PATH', mingwBin + File.pathSeparator + System.getenv('PATH')
    environment 'PROTOC', protoc
    commandLine 'cargo', '+stable-x86_64-pc-windows-gnu', 'build', '-p', 'stoich-worker', '--release'
    inputs.dir('rust/src')
    inputs.dir('rust/lib')
    inputs.dir('rust/buildscript')
    inputs.file('rust/Cargo.toml')
    outputs.file(nativeLibrary)
}

tasks.register('stageWorker', Copy) {
    group = 'stoich'
    description = 'Copy stoich.dll into the jar resources for this platform.'
    onlyIf { !skipNative }
    // onlyIf does not skip dependencies. Keep the Windows GNU build off the CI test graph.
    if (!skipNative) {
        dependsOn 'cargoBuild'
    }
    from(nativeLibrary)
    into(nativeRoot.map { it.dir('windows-x86_64') })
    rename { "stoich-${workerVersion}.dll" }
}

// Cargo names in, versioned jar names out. A missing platform is skipped, not an error.
def prebuiltNames = [
    'windows-x86_64': ['stoich.dll', "stoich-${workerVersion}.dll"],
    'linux-x86_64'  : ['libstoich.so', "libstoich-${workerVersion}.so"],
    'linux-aarch64' : ['libstoich.so', "libstoich-${workerVersion}.so"],
    'macos-x86_64'  : ['libstoich.dylib', "libstoich-${workerVersion}.dylib"],
    'macos-aarch64' : ['libstoich.dylib', "libstoich-${workerVersion}.dylib"],
    'android-arm64-v8a'  : ['libstoich.so', "libstoich-${workerVersion}.so"],
    'android-armeabi-v7a': ['libstoich.so', "libstoich-${workerVersion}.so"],
    'android-x86_64'     : ['libstoich.so', "libstoich-${workerVersion}.so"],
    'android-x86'        : ['libstoich.so', "libstoich-${workerVersion}.so"],
]

tasks.register('stagePrebuilt') {
    group = 'stoich'
    description = 'Stage native libraries built on other machines, one directory per platform.'
    onlyIf { prebuiltRoot != null }
    def source = prebuiltRoot == null ? file('prebuilt') : file(prebuiltRoot)
    inputs.dir(source).optional()
    outputs.dir(nativeRoot)
    doLast {
        prebuiltNames.each { platform, pair ->
            def incoming = new File(source, "${platform}/${pair[0]}")
            if (!incoming.isFile()) {
                return
            }
            def outDir = nativeRoot.get().dir(platform).asFile
            outDir.mkdirs()
            java.nio.file.Files.copy(incoming.toPath(), new File(outDir, pair[1]).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('processResources') {
    if (prebuiltRoot != null) {
        dependsOn 'stagePrebuilt'
    } else if (!skipNative) {
        dependsOn 'stageWorker'
    }
    from(nativeRoot) {
        into 'native'
    }
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Title': 'stoich', 'Implementation-Version': workerVersion)
    }
}

// `build` already reaches the dll through processResources, but depending on it directly keeps the
// Rust compile on the task IDEA runs, even if the resource chain changes.
tasks.named('build') {
    if (!skipNative) {
        dependsOn 'cargoBuild'
    }
}

tasks.withType(Test).configureEach {
    if (!skipNative) {
        dependsOn 'cargoBuild'
    }
    environment 'STOICH_LIBRARY', libraryOverride ? file(libraryOverride).absolutePath : nativeLibrary.absolutePath
}
