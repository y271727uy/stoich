name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            library: stoich.dll
          - os: ubuntu-latest
            platform: linux-x86_64
            library: libstoich.so
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            library: libstoich.so
          - os: macos-latest
            platform: macos-aarch64
            library: libstoich.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: test the kernel
        working-directory: rust
        run: cargo test -p stoich-kernel
      - name: build the library
        working-directory: rust
        run: cargo build -p stoich-worker --release
      - name: test through jni
        shell: bash
        run: ./gradlew test --no-daemon -PstoichSkipNative=true "-PstoichLibrary=${{ github.workspace }}/rust/target/release/${{ matrix.library }}"
      - name: pack the library
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.platform }}"
          cp "rust/target/release/${{ matrix.library }}" "out/${{ matrix.platform }}/${{ matrix.library }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: out/${{ matrix.platform }}

  package:
    name: jar
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: prebuilt
          merge-multiple: true
      - name: build the jar
        run: ./gradlew jar --no-daemon -PstoichPrebuilt=prebuilt -PstoichSkipNative=true
      - uses: actions/upload-artifact@v4
        with:
          name: stoich-jar
          path: build/libs/*.jar
      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "$GITHUB_REF_NAME" --notes "Native libraries for Windows x86_64, Linux x86_64, Linux aarch64 and macOS aarch64."
