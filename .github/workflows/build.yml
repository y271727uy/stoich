name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            library: stoich.dll
          - os: ubuntu-latest
            platform: linux-x86_64
            library: libstoich.so
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            library: libstoich.so
          - os: macos-latest
            platform: macos-aarch64
            library: libstoich.dylib
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: test the kernel
        working-directory: rust
        run: cargo test -p stoich-kernel
      - name: build the library
        working-directory: rust
        run: cargo build -p stoich-worker --release
      - name: test through jni
        shell: bash
        run: bash ./gradlew test --no-daemon -PstoichSkipNative=true "-PstoichLibrary=${{ github.workspace }}/rust/target/release/${{ matrix.library }}"
      - name: pack the library
        shell: bash
        run: |
          mkdir -p "out/${{ matrix.platform }}"
          cp "rust/target/release/${{ matrix.library }}" "out/${{ matrix.platform }}/${{ matrix.library }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: out/${{ matrix.platform }}

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27d
      - name: install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: build the android libraries
        working-directory: rust
        run: cargo ndk --platform 24 -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 -o "${{ github.workspace }}/jniLibs" build -p stoich-worker --release
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: pack the libraries
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "out/android-${abi}"
            cp "jniLibs/${abi}/libstoich.so" "out/android-${abi}/libstoich.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-android
          path: out/android-*

  package:
    name: jar
    needs: [native, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: prebuilt
          merge-multiple: true
      - name: build the jar
        run: bash ./gradlew jar --no-daemon -PstoichPrebuilt=prebuilt -PstoichSkipNative=true
      - uses: actions/upload-artifact@v4
        with:
          name: stoich-jar
          path: build/libs/*.jar
      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "$GITHUB_REF_NAME" --notes "Native libraries for Windows x86_64, Linux x86_64, Linux aarch64, macOS aarch64, and Android arm64-v8a, armeabi-v7a, x86_64, x86."
